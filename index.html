<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>作品集</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-0: #15121c;
    --bg-1: #1e1929;
    --bg-2: #271f36;
    --panel: #241d33;
    --accent: #e8a33d;
    --accent-2: #7fe0bd;
    --ink: #f3ede4;
    --ink-dim: #b6abc2;
    --ink-faint: #8a7f9c;
    --line: rgba(243, 237, 228, 0.12);
    --radius-lg: 28px;
    --radius-md: 16px;
    --radius-sm: 10px;
    --serif: 'Noto Serif TC', serif;
    --sans: 'Noto Sans TC', sans-serif;
  }
  :root:not([data-theme="light"]) {
    --bg-0: #15121c; --bg-1: #1e1929; --bg-2: #271f36; --panel: #241d33;
    --ink: #f3ede4; --ink-dim: #b6abc2; --ink-faint: #8a7f9c; --line: rgba(243, 237, 228, 0.12);
  }
  :root[data-theme="dark"] {
    --bg-0: #15121c; --bg-1: #1e1929; --bg-2: #271f36; --panel: #241d33;
    --ink: #f3ede4; --ink-dim: #b6abc2; --ink-faint: #8a7f9c; --line: rgba(243, 237, 228, 0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-0: #15121c; --bg-1: #1e1929; --bg-2: #271f36; --panel: #241d33;
      --ink: #f3ede4; --ink-dim: #b6abc2; --ink-faint: #8a7f9c; --line: rgba(243, 237, 228, 0.12);
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg-0);
    color: var(--ink);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* ---------- 流動背景 ---------- */
  .bg-flow {
    position: fixed;
    inset: -20% -20%;
    z-index: 0;
    filter: blur(60px);
    opacity: 0.55;
    pointer-events: none;
  }
  .bg-flow span {
    position: absolute;
    border-radius: 50%;
    mix-blend-mode: screen;
  }
  .bg-flow span:nth-child(1) {
    width: 46vw; height: 46vw; left: 4%; top: 8%;
    background: radial-gradient(circle at 35% 35%, #7fe0bd, transparent 70%);
    animation: drift1 26s ease-in-out infinite;
  }
  .bg-flow span:nth-child(2) {
    width: 40vw; height: 40vw; right: 2%; top: 30%;
    background: radial-gradient(circle at 60% 40%, #e8a33d, transparent 70%);
    animation: drift2 32s ease-in-out infinite;
  }
  .bg-flow span:nth-child(3) {
    width: 34vw; height: 34vw; left: 30%; bottom: -6%;
    background: radial-gradient(circle at 50% 50%, #a389f4, transparent 70%);
    animation: drift3 30s ease-in-out infinite;
  }
  @keyframes drift1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(8vw, 6vh) scale(1.15); }
  }
  @keyframes drift2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-6vw, 8vh) scale(1.1); }
  }
  @keyframes drift3 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(5vw, -5vh) scale(1.2); }
  }
  @media (prefers-reduced-motion: reduce) {
    .bg-flow span { animation: none; }
  }

  .page {
    position: relative;
    z-index: 1;
    max-width: 880px;
    margin: 0 auto;
    padding: 64px 24px 96px;
  }

  /* ---------- 頭像／個人資訊 ---------- */
  .profile {
    display: flex;
    align-items: center;
    gap: 28px;
    margin-bottom: 48px;
  }
  .avatar {
    width: 116px;
    height: 116px;
    flex-shrink: 0;
    border-radius: 34% 66% 62% 38% / 42% 38% 62% 58%;
    background: linear-gradient(150deg, var(--accent), var(--accent-2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--serif);
    font-size: 40px;
    font-weight: 700;
    color: var(--bg-0);
    animation: breathe 5s ease-in-out infinite;
    box-shadow: 0 20px 50px -18px rgba(232, 163, 61, 0.5);
  }
  .avatar img {
    width: 100%; height: 100%; object-fit: cover;
    border-radius: inherit;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); border-radius: 34% 66% 62% 38% / 42% 38% 62% 58%; }
    50% { transform: scale(1.035); border-radius: 42% 58% 50% 50% / 50% 44% 56% 50%; }
  }
  .profile h1 {
    font-family: var(--serif);
    font-weight: 900;
    font-size: clamp(28px, 5vw, 38px);
    margin: 0 0 6px;
    letter-spacing: 0.01em;
  }
  .profile p {
    margin: 0;
    color: var(--ink-dim);
    font-size: 15px;
    line-height: 1.7;
    max-width: 46ch;
  }

  /* ---------- 分頁切換 ---------- */
  nav.tabs {
    display: flex;
    gap: 6px;
    padding: 6px;
    background: var(--bg-1);
    border: 1px solid var(--line);
    border-radius: 999px;
    width: fit-content;
    margin-bottom: 40px;
  }
  nav.tabs button {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--ink-dim);
    font-family: var(--sans);
    font-size: 14.5px;
    font-weight: 500;
    padding: 10px 20px;
    border-radius: 999px;
    cursor: pointer;
    transition: color 0.25s ease, background 0.25s ease;
  }
  nav.tabs button:hover { color: var(--ink); }
  nav.tabs button.active {
    background: var(--accent);
    color: #241505;
    font-weight: 700;
  }
  nav.tabs button:focus-visible {
    outline: 2px solid var(--accent-2);
    outline-offset: 2px;
  }

  .panel { display: none; }
  .panel.active {
    display: block;
    animation: fadein 0.4s ease;
  }
  @keyframes fadein {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  h2.section-title {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 24px;
  }

  /* ---------- 作品集 ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    overflow: hidden;
    transition: transform 0.25s ease, border-color 0.25s ease;
  }
  .card:hover { transform: translateY(-4px); border-color: var(--accent); }
  .card .thumb {
    aspect-ratio: 4 / 3;
    background: linear-gradient(135deg, var(--bg-2), var(--panel));
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-faint);
    font-size: 13px;
  }
  .card .info { padding: 16px 18px 20px; }
  .card h3 {
    font-family: var(--serif);
    font-size: 16.5px;
    margin: 0 0 6px;
    font-weight: 700;
  }
  .card p {
    margin: 0;
    color: var(--ink-dim);
    font-size: 13.5px;
    line-height: 1.6;
  }
  .card .tag {
    display: inline-block;
    margin-top: 10px;
    font-size: 12px;
    color: var(--accent-2);
  }

  /* ---------- 經歷 ---------- */
  .timeline {
    border-left: 2px solid var(--line);
    padding-left: 26px;
    display: flex;
    flex-direction: column;
    gap: 30px;
  }
  .timeline .entry { position: relative; }
  .timeline .entry::before {
    content: "";
    position: absolute;
    left: -32px;
    top: 4px;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--accent-2);
    box-shadow: 0 0 0 4px var(--bg-0);
  }
  .timeline .year {
    color: var(--accent);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.03em;
  }
  .timeline h3 {
    font-family: var(--serif);
    font-size: 17px;
    margin: 4px 0 6px;
  }
  .timeline p {
    margin: 0;
    color: var(--ink-dim);
    font-size: 14px;
    line-height: 1.7;
  }

  /* ---------- 聯絡我 ---------- */
  .contact-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .contact-list a {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--ink);
    text-decoration: none;
    font-size: 15px;
  }
  .contact-list a:first-child { border-radius: var(--radius-md) var(--radius-md) 0 0; }
  .contact-list a:last-child { border-radius: 0 0 var(--radius-md) var(--radius-md); }
  .contact-list a:not(:last-child) { border-bottom: none; }
  .contact-list a span.method { color: var(--ink-faint); font-size: 13px; }
  .contact-list a:hover { background: var(--bg-2); }

  /* ---------- 作品卡片內的連結 ---------- */
  .card .info {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  .card-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 12px;
    padding: 7px 14px;
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--accent-2);
    text-decoration: none;
    font-size: 12.5px;
    transition: border-color 0.25s ease, background 0.25s ease;
  }
  .card-link:hover {
    border-color: var(--accent-2);
    background: var(--bg-1);
  }

  footer {
    margin-top: 64px;
    color: var(--ink-faint);
    font-size: 12.5px;
    text-align: center;
  }

  @media (max-width: 560px) {
    .profile { flex-direction: column; align-items: flex-start; }
    nav.tabs { width: 100%; overflow-x: auto; }
  }
</style>
</head>
<body>

<div class="bg-flow"><span></span><span></span><span></span></div>

<div class="page">

  <div class="profile">
    <div class="avatar">
      
      <img src="2.jpg" alt="頭貼"/> 
      
    </div>
    <div>
      <h1>培根</h1>
      <p>Vtuber用建模/小說/遊戲製作，目前積極接受Live2D建模相關委託。</p>
    </div>
  </div>

  <nav class="tabs" role="tablist" aria-label="網站區塊">
    <button class="active" data-tab="works" role="tab" aria-selected="true">作品集</button>
    <button data-tab="contact" role="tab" aria-selected="false">聯絡方式</button>
  </nav>

  <section id="works" class="panel active">
    <h2 class="section-title">作品集</h2>
    <div class="grid">
      <div class="card">
        <div class="thumb">作品縮圖</div>
        <div class="info">
          <h3>Live2D 建模展示</h3>
          <span class="tag">Live2D</span>
          <a class="card-link" href="https://www.youtube.com/playlist?list=PLllcL567cZtyEML73FIZMFUVwufKEj-JT" target="_blank" rel="noopener">查看作品</a>
        </div>
      </div>
      <div class="card">
        <div class="thumb">作品縮圖</div>
        <div class="info">
          <h3>小說</h3>
          <p>這裡暫時沒有東西。</p>
          <span class="tag">寫作</span>
          <a class="card-link" href="" target="_blank" rel="noopener">查看作品</a>
        </div>
      </div>
      <div class="card">
        <div class="thumb">作品縮圖</div>
        <div class="info">
          <h3>遊戲專案 </h3>
          <p>這裡暫時沒有東西。</p>
          <span class="tag">遊戲設計</span>
          <a class="card-link" href="" target="_blank" rel="noopener">查看作品</a>
        </div>
      </div>
    </div>
  </section>


  <section id="contact" class="panel">
    <h2 class="section-title">聯絡方式</h2>
    <div class="contact-list">
      <a href="mailto:bacon16417@gmail.com">Email <span class="method">bacon16417@gmail.com</span></a>

    </div>
  </section>


</div>

<script>
  const buttons = document.querySelectorAll('nav.tabs button');
  const panels = document.querySelectorAll('.panel');

  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      const target = btn.dataset.tab;

      buttons.forEach(b => {
        b.classList.toggle('active', b === btn);
        b.setAttribute('aria-selected', b === btn ? 'true' : 'false');
      });

      panels.forEach(p => {
        p.classList.toggle('active', p.id === target);
      });
    });
  });
</script>

</body>
</html>
